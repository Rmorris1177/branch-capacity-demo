<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Branch · Interactive fictional preview</title>
  <style>
    :root {
      --green: #203f35;
      --muted: #73786d;
      --line: #e2e5da;
      --bg: #f6f7f1;
      --lime: #d7e6ad;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font:
        14px/1.5 system-ui,
        sans-serif;
      color: var(--green);
      background: var(--bg);
    }
    button,
    select,
    input {
      font: inherit;
    }
    button {
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      color: var(--green);
      padding: 10px 16px;
    }
    button:hover {
      background: #edf1e3;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #86a35d;
      outline-offset: 3px;
    }
    .primary {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .primary:hover {
      background: #395a46;
    }
    .shell {
      display: grid;
      grid-template-columns: 228px 1fr;
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      padding: 32px 22px;
      position: sticky;
      top: 0;
      height: 100vh;
      background: #fff;
    }
    .logo {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -2px;
      margin: 0 10px 44px;
    }
    .logo span {
      color: #94b363;
      display: inline-block;
      width: 17px;
      height: 17px;
      border-top: 3px solid;
      border-right: 3px solid;
      transform: rotate(-10deg);
      font-size: 0;
    }
    .workspace {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--muted);
      margin: 20px 12px 12px;
    }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      margin: 6px 0;
      background: transparent;
      padding: 12px;
    }
    nav .active {
      background: #eaf0dc;
      font-weight: 600;
    }
    .aside-note {
      position: absolute;
      bottom: 26px;
      left: 32px;
      color: var(--muted);
      font-size: 12px;
    }
    .topbar {
      height: 80px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 42px;
      background: #fff;
    }
    .avatar {
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      background: #e9eddd;
      width: 34px;
      height: 34px;
      margin-right: 10px;
    }
    .topbar small {
      color: var(--muted);
    }
    main {
      padding: 36px 42px;
      max-width: 1500px;
      margin: auto;
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-size: 34px;
      letter-spacing: -1.2px;
      font-weight: 500;
      margin: 8px 0;
    }
    h2 {
      font-size: 19px;
      font-weight: 550;
      margin: 0;
    }
    p {
      color: var(--muted);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin: 28px 0;
    }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 24px;
    }
    .stat strong {
      display: block;
      font-size: 34px;
      font-weight: 500;
      margin: 12px 0;
    }
    .stat small {
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      border-radius: 20px;
      background: #eff2e6;
      padding: 4px 10px;
      font-size: 11px;
      white-space: nowrap;
    }
    .warn {
      background: #fbefd5;
      color: #866722;
    }
    .good {
      background: #e9f1de;
      color: #426230;
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 22px;
    }
    .section {
      margin-top: 28px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      text-align: left;
      margin-top: 20px;
    }
    th {
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted);
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }
    td {
      padding: 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    tr:last-child td {
      border: 0;
    }
    .link {
      border: 0;
      padding: 0;
      background: transparent;
      font-weight: 600;
      text-align: left;
    }
    .bar {
      height: 8px;
      border-radius: 10px;
      background: #eef0e7;
      overflow: hidden;
      margin: 12px 0;
    }
    .bar i {
      height: 100%;
      display: block;
      background: #a8bf7b;
    }
    .bar.over i {
      background: #c09a56;
    }
    .supplier {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .supplier:last-child {
      border: 0;
    }
    .steps {
      display: flex;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }
    .steps .current {
      color: var(--green);
      font-weight: 700;
    }
    .compare {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 24px;
    }
    .compare h2 {
      margin: 12px 0;
    }
    .metric {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }
    .metric small {
      display: block;
      color: var(--muted);
    }
    .metric strong {
      display: block;
      margin-top: 7px;
      font-size: 18px;
      font-weight: 500;
    }
    .compare button {
      width: 100%;
      margin-top: 24px;
    }
    .back {
      border: 0;
      padding: 0;
      background: transparent;
      margin-bottom: 24px;
      color: var(--muted);
    }
    .callout {
      background: #eef2e4;
      border: 1px solid #d9e2c6;
      border-radius: 8px;
      padding: 18px;
      margin: 22px 0;
    }
    select {
      padding: 10px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--green);
    }
    .footer {
      font-size: 11px;
      color: var(--muted);
      margin-top: 26px;
    }
    .empty {
      padding: 25px 0;
      color: var(--muted);
    }
    #error {
      color: #9b3b2c;
    }
    .wide {
      max-width: 850px;
    }
    .check {
      font-size: 40px;
      color: #88a461;
    }
    .split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 1000px) {
      .shell {
        grid-template-columns: 180px 1fr;
      }
      main {
        padding: 25px;
      }
      .topbar {
        padding: 0 25px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .compare {
        grid-template-columns: 1fr;
      }
      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 650px) {
      .shell {
        display: block;
      }
      aside {
        position: static;
        height: auto;
        padding: 12px;
      }
      .logo {
        margin: 0 12px;
        font-size: 26px;
      }
      nav {
        display: flex;
      }
      nav button {
        padding: 8px;
      }
      .workspace,
      .aside-note {
        display: none;
      }
      .topbar {
        min-height: 80px;
        height: auto;
        padding: 12px 16px;
        gap: 12px;
      }
      .topbar > span:last-child {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }
      .topbar button {
        padding: 6px 10px;
      }
      .topbar .avatar {
        display: none;
      }
      main {
        padding: 20px 16px;
      }
      h1 {
        font-size: 27px;
      }
      .card {
        padding: 16px;
      }
      .row {
        flex-wrap: wrap;
      }
      .split {
        grid-template-columns: 1fr;
      }
      table {
        font-size: 12px;
      }
      td,
      th {
        padding: 12px 5px;
      }
      .table-wrap {
        overflow: auto;
      }
    }
    dialog {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
      color: var(--green);
      width: min(640px, calc(100% - 32px));
      max-height: 90vh;
      overflow: auto;
    }
    dialog::backdrop {
      background: #16352a66;
    }
    dialog .form-field {
      margin: 14px 0;
    }
    dialog label {
      display: block;
      margin: 14px 0;
    }
    dialog input:not([type="checkbox"]),
    dialog textarea,
    dialog select {
      display: block;
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      color: var(--green);
      background: white;
    }
    dialog textarea {
      min-height: 110px;
      resize: vertical;
    }
    dialog .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }
    dialog [role="alert"] {
      color: #9b3b2c;
    }
    button[aria-pressed="true"] {
      background: #eaf0dc;
      border-color: #9dbb76;
    }
    .cancel-reservation {
      display: block;
      margin-top: 12px;
      font-size: 12px;
    }
    .compare .cancel-reservation {
      width: auto;
    }
    #notice:not(:empty) {
      padding: 12px 16px;
      background: #eaf0dc;
      border-radius: 6px;
    }
    button:disabled {
      cursor: default;
      opacity: 0.55;
    }
    dialog .split {
      gap: 16px;
    }
    button,
    td {
      overflow-wrap: anywhere;
    }
    :root {
  --green: #213f35;
  --muted: #767773;
  --line: #e4e1db;
  --bg: #f6f4ef;
  --lime: #e5ebdf;
  --ink: #1d211f;
}
body {
  color: var(--ink);
  background: radial-gradient(ellipse at top, #fcfbf8, #eeeae3);
  font-family: Arial, Helvetica, sans-serif;
}
.shell {
  grid-template-columns: 202px minmax(0, 1fr);
  max-width: 1660px;
  margin: 18px auto;
  min-height: calc(100vh - 36px);
  border: 1px solid #c9c5bd;
  border-radius: 12px;
  box-shadow: 0 10px 35px #26372d0b;
  overflow: clip;
  background: #f8f6f2;
}
aside {
  background: linear-gradient(130deg, #254438, #1e382f);
  color: #fff;
  border: 0;
  padding: 24px 12px;
  height: calc(100vh - 36px);
  min-height: 540px;
}
.logo {
  font-weight: 500;
  font-size: 28px;
  letter-spacing: -1px;
  margin: 0 12px;
}
.logo span {
  display: none;
}
.brand-subtitle {
  font-size: 14px;
  line-height: 1.5;
  margin: 5px 12px 30px;
  max-width: 130px;
}
.workspace {
  display: none;
}
nav button {
  color: #fff;
  padding: 12px 14px;
  border-radius: 5px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 13px;
}
nav button:hover {
  background: #ffffff12;
}
nav .active {
  background: #ffffff20;
  color: #fff;
  font-weight: 500;
}
.nav-icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}
.aside-note {
  color: #edf1ec;
  left: 26px;
  font-size: 12px;
  max-width: 135px;
  bottom: 26px;
}
.aside-note hr {
  border-top-color: #ffffff40 !important;
}
.topbar {
  height: 64px;
  padding: 0 30px;
  background: transparent;
  font-size: 12px;
  border-color: var(--line);
}
.topbar > span:last-child {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.avatar {
  width: 28px;
  height: 28px;
  margin-right: 3px;
  background: #e6e5e0;
  color: #202522;
  font-size: 10px;
}
.topbar button {
  font-size: 11px;
  padding: 7px 10px;
}
.topbar #agent-toggle {
  color: var(--green);
  background: #e7ede2;
  border-color: #dce3d6;
}
main {
  max-width: none;
  padding: 25px 30px;
}
h1 {
  color: #121714;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.9px;
  line-height: 1.2;
  margin: 5px 0 18px;
}
h2 {
  font-size: 16px;
  font-weight: 600;
  color: #1a201c;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 1.1px;
}
.card {
  border-radius: 7px;
  padding: 20px;
  background: #ffffffa8;
  border: 1px solid #e7e3dc;
  box-shadow: 0 2px 7px #283d2e02;
}
button {
  border-radius: 5px;
  padding: 9px 13px;
  color: var(--green);
  border-color: #deded4;
  background: #fff;
}
.primary {
  background: linear-gradient(#2c4b3f, #203b31);
  border: 1px solid #203b31;
  color: #fff;
}
.pill {
  border-radius: 7px;
  font-size: 10px;
  padding: 5px 10px;
  font-weight: 400;
  color: #505750;
  background: #eee;
}
.pill.good {
  background: #e4ecdf;
  color: #285033;
}
.pill.warn {
  background: #faedd8;
  color: #705523;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: #387245;
  margin-right: 6px;
}
.pill.warn .dot {
  background: #dd921c;
}
.pill.neutral .dot {
  background: #858b88;
}
.stats {
  gap: 10px;
  margin: 20px 0 28px;
}
.stat {
  padding: 18px;
  display: grid;
  grid-template-columns: 25px 1fr;
  column-gap: 10px;
}
.stat .stat-icon {
  font-size: 22px;
  color: var(--green);
}
.stat strong {
  font-size: 22px;
  margin: 0 0 5px;
}
.stat .stat-label {
  font-size: 12px;
}
.stat small {
  font-size: 10px;
  display: block;
  margin-top: 6px;
}
.project-list {
  margin-top: 16px;
}
.project-row {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr) auto 20px;
  align-items: center;
  gap: 20px;
  padding: 12px;
  background: #ffffff94;
  border: 1px solid var(--line);
  border-radius: 6px;
  margin: 8px 0;
}
.project-row .project-name {
  font-size: 13px;
  font-weight: 500;
  color: #141a16;
}
.project-row small {
  display: block;
  color: var(--muted);
  margin-top: 9px;
  font-size: 10px;
}
.project-row .arrow {
  border: 0;
  padding: 5px;
  background: transparent;
  font-size: 20px;
}
.product-art {
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  background: #d7cbb8;
  height: 82px;
}
.product-art .product-strip {
  position: absolute;
  width: 300%;
  height: 100%;
  max-width: none;
  object-fit: fill;
  left: 0;
  top: 0;
}
.product-art.chair .product-strip {
  left: -100%;
}
.product-art.panel .product-strip {
  left: -200%;
}
.product-art .desk-photo {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.project-hero {
  display: grid;
  grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.1fr);
  gap: 28px;
  align-items: start;
  margin-bottom: 16px;
}
.project-hero .product-art {
  height: 275px;
}
.project-heading {
  padding: 3px 0;
}
.project-heading .eyebrow {
  letter-spacing: 0;
  text-transform: none;
  font-size: 11px;
  margin-bottom: 12px;
}
.project-heading h1 {
  font-size: 29px;
  max-width: 560px;
  margin-top: 14px;
  margin-bottom: 23px;
}
.project-metadata {
  display: flex;
  gap: 24px;
  margin-bottom: 20px;
}
.project-metadata > div {
  border-right: 1px solid var(--line);
  padding-right: 24px;
}
.project-metadata > div:last-child {
  border: 0;
  padding: 0;
}
.project-metadata small {
  display: block;
  color: #6f716c;
  font-size: 11px;
  margin-bottom: 7px;
}
.project-metadata strong {
  font-size: 13px;
  font-weight: 400;
}
.project-heading p {
  font-size: 13px;
  line-height: 1.8;
  margin: 0;
  color: #5b5e59;
  white-space: pre-wrap;
}
.project-tabs {
  display: flex;
  gap: 25px;
  border-bottom: 1px solid var(--line);
  margin: 10px 0 17px;
}
.project-tabs button {
  border: 0;
  background: transparent;
  border-radius: 0;
  color: #5e625d;
  padding: 12px 7px;
  font-size: 12px;
}
.project-tabs button.active {
  border-bottom: 2px solid var(--green);
  font-weight: 600;
  color: #17251c;
}
.project-content {
  display: grid;
  grid-template-columns: minmax(0, 2.3fr) minmax(265px, 1fr);
  gap: 16px;
}
.project-content > .card {
  padding: 0;
}
.card-heading {
  padding: 15px 18px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.card-heading h2 {
  font-size: 14px;
}
.card-body {
  padding: 18px;
}
table {
  margin: 0;
  font-size: 12px;
}
th {
  font-size: 10px;
  text-transform: none;
  letter-spacing: 0;
  color: #6a6c67;
  padding: 13px 18px;
}
td {
  padding: 16px 18px;
}
.supplier-table .link {
  font-weight: 400;
  color: #181f1a;
}
.supplier-table td small {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 8px;
}
.supplier-table .tiny {
  padding: 5px 8px;
  font-size: 10px;
}
.next-action {
  display: flex;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid var(--line);
}
.next-action:last-child {
  border: 0;
}
.action-marker {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  border: 1px solid #abb2a8;
  border-radius: 50%;
  margin-top: 2px;
  background: transparent;
  padding: 0;
}
.action-marker.overdue {
  background: #e7ae4a;
  border-color: #e7ae4a;
  color: white;
  font-size: 11px;
}
.next-action strong {
  font-size: 12px;
  display: block;
  font-weight: 500;
}
.next-action small {
  font-size: 10px;
  display: block;
  color: var(--muted);
  margin-top: 5px;
}
.next-action time {
  font-size: 10px;
  color: var(--muted);
  margin-left: auto;
  white-space: nowrap;
}
.quiet-link {
  font-size: 11px;
  padding: 0;
  border: 0;
  background: transparent;
  text-decoration: underline;
  color: #446457;
}
.agent-card {
  background: #eef1e9;
  border-color: #dbe3d1;
}
.agent-card .agent-symbol {
  display: grid;
  place-items: center;
  background: #dae5cf;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  color: #3d5f36;
}
.agent-card p {
  font-size: 12px;
  line-height: 1.7;
}
.agent-layout {
  display: flex;
  gap: 8px;
  align-items: center;
}
.agent-layout h2 {
  font-size: 14px;
}
.agent-mode {
  font-size: 10px;
  color: #6f7b63;
}
.agent-panel {
  position: fixed;
  right: 18px;
  top: 83px;
  bottom: 18px;
  width: 390px;
  z-index: 10;
  background: #fbfaf7;
  border: 1px solid #d7d9ce;
  border-radius: 10px;
  box-shadow: 0 20px 70px #18312630;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.agent-panel[hidden] {
  display: none;
}
.agent-panel .agent-head {
  padding: 20px;
  border-bottom: 1px solid var(--line);
}
.agent-panel .agent-content {
  padding: 20px;
  overflow: auto;
  flex: 1;
}
.agent-panel h2 {
  font-size: 18px;
}
.agent-panel p {
  font-size: 13px;
  line-height: 1.65;
}
.agent-panel .agent-question {
  display: flex;
  gap: 8px;
  margin-top: 16px;

        ? '<span class="pill">Not assessed</span>'
        : load(s) + extra > limit(s)
          ? '<span class="pill warn">Over limit</span>'
          : load(s) + extra === limit(s)
            ? '<span class="pill warn">At limit</span>'
            : '<span class="pill good">Within limit</span>';
    }
    function bar(s, extra = 0) {
      return `<div class="bar ${limit(s) !== null && load(s) + extra > limit(s) ? "over" : ""}"><i style="width:${limit(s) === null ? 0 : Math.min(100, (100 * (load(s) + extra)) / Math.max(limit(s), 1))}%"></i></div>`;
    }
    function saveLocation() {
      history.pushState(
        null,
        "",
        `#${page}?project=${projectId}&supplier=${supplierId}&quarter=${quarter}${page === "actions" ? "&" + actionFilterQuery() : ""}${page === "projects" ? "&" + projectPeriodQuery() : ""}${page === "developer" ? "&developer=" + encodeURIComponent(developerName) : ""}`,
      );
    }
    function readLocation() {
      let [name, query] = location.hash.slice(1).split("?"),
        params = new URLSearchParams(query);
      page = [
        "dashboard",
        "projects",
        "project",
        "comparison",
        "preview",
        "selection",
        "workload",
        "suppliers",
        "supplier",
        "actions",
        "developers",
        "developer",
      ].includes(name)
        ? name
        : "dashboard";
      projectId = state.projects.some((p) => p.id === +params.get("project"))
        ? +params.get("project")
        : state.projects[0]?.id;
      supplierId = state.suppliers.some((s) => s.id === +params.get("supplier"))
        ? +params.get("supplier")
        : state.suppliers[0]?.id;
      quarter = state.quarters.includes(params.get("quarter"))
        ? params.get("quarter")
        : "2026-Q4";
      if (page === "actions") readActionFilters(params);
      if (page === "projects") readProjectPeriod(params);
      if (page === "developer")
        developerName = state.people.includes(params.get("developer"))
          ? params.get("developer")
          : state.people[0];
    }
    function go(p) {
      if (!state) return;
      if ($("#tracking-agent")) $("#tracking-agent").hidden = true;
      page = p;
      saveLocation();
      render();
      window.scrollTo(0, 0);
    }
    function steps() {
      return `<div class="steps">${["project", "comparison", "preview", "selection", "workload"].map((p, i) => `<span class="${page === p ? "current" : ""}">${i + 1}. ${["Project brief", "Compare suppliers", "Capacity preview", "Sample selection", "Supplier workload"][i]}</span>`).join("<span>→</span>")}</div>`;
    }
    function projectTable() {
      return `<div class="table-wrap"><table><thead><tr><th>Project / category</th><th>Owner</th><th>Stage</th><th></th></tr></thead><tbody>${state.projects.map((p) => `<tr><td><button class="link" data-project="${p.id}">${esc(p.name)}</button><br><small style="color:var(--muted)">${esc(p.category)}</small></td><td>${esc(p.owner)}</td><td><span class="pill">${esc(p.status)}</span></td><td><button data-project="${p.id}" aria-label="Open ${esc(p.name)}">→</button></td></tr>`).join("")}</tbody></table></div>`;
    }
    function render() {
      $("#crumb").textContent = {
        dashboard: "Overview",
        projects: "Projects",

        selection: "Sample selection",
        confirmed: "Reservation confirmed",

        actions: "Actions",
        developers: "Product Developers",
        developer: "Developer actions",
        suppliers: "Suppliers",
        supplier: "Supplier overview",
      }[page];
      document
        .querySelectorAll("nav button")

      let html = "";
      if (page === "dashboard" || page === "projects") {
        html = `<div class="row"><div><div class="eyebrow">Branch / Development planning</div><h1>${page === "dashboard" ? "A little clarity. A lot of possibility." : "Projects in motion."}</h1><p>Bring projects, suppliers, and development capacity into view.</p></div><span class="pill">${quarter}</span></div>${page === "dashboard" ? `<div class="stats"><div class="card stat">Active projects<strong>${state.projects.filter((p) => p.status !== "Complete").length}</strong><small>Across the workspace</small></div><div class="card stat">Supplier partners<strong>3</strong><small>Open for comparison</small></div><div class="card stat">Sample reservations<strong>${state.reservations.length}</strong><small>Across all quarters</small></div><div class="card stat">Needs a conversation<strong>${state.suppliers.filter((s) => limit(s) === null || load(s) > limit(s)).length}</strong><small>Capacity to review this quarter</small></div></div>` : ""}<div class="${page === "dashboard" ? "grid section" : "section"}"><section class="card"><div class="row"><h2>Project overview</h2><span class="eyebrow">6 projects</span></div>${projectTable()}</section>${page === "dashboard" ? `<section class="card"><div class="eyebrow">${quarter} snapshot</div><h2 style="margin-top:8px">Room to grow?</h2><p>A shared look at supplier development workload.</p>${state.suppliers.map((s) => `<div class="supplier"><div class="row"><strong>${esc(s.name)}</strong>${badge(s)}</div>${bar(s)}<small>${load(s)} scheduled / ${limit(s) === null ? "limit not assessed" : limit(s) + " project slots"}</small></div>`).join("")}<button style="margin-top:20px;width:100%" data-go="workload">Explore supplier workload →</button></section>` : ""}</div>`;
      }
      if (page === "project") {
        let p = selected();
        html = `<button class="back" data-go="projects">← All projects</button><div class="eyebrow">Project / BR-${String(p.id).padStart(3, "0")}</div><h1>${esc(p.name)}</h1><p>Thoughtful products start with the right partnerships.</p>${steps()}<div class="grid"><section class="card"><div class="row"><h2>Project brief</h2><span><span class="pill">${esc(p.status)}</span> <button id="edit-project">Edit brief</button></span></div><p style="white-space:pre-wrap">${esc(p.description)}</p><div class="split"><div class="metric"><small>Project owner</small><strong>${esc(p.owner)}</strong></div><div class="metric"><small>Development window</small><strong>${esc(p.development_start)} – ${esc(p.development_end)}</strong></div><div class="metric"><small>Category</small><strong>${esc(p.category)}</strong></div><div class="metric"><small>Sample target</small><strong>${esc(p.sample_due)}</strong></div></div><div class="callout">Compare multiple suppliers for this project. Selecting a sample reserves one development slot with that supplier for the chosen quarter.</div><button class="primary" data-go="comparison">Compare suppliers →</button><div class="section"><h2>Sample reservations</h2><p>Reservations stay in their chosen quarter when the brief’s dates change. Release a reservation here to free its slot.</p>${
          state.reservations.filter((r) => r.project_id === projectId).length
            ? state.reservations
                .filter((r) => r.project_id === projectId)
                .map(
                  (r) =>
                    `<div class="supplier"><strong>${esc(state.suppliers.find((s) => s.id === r.supplier_id).name)}</strong> <span class="pill good">${r.quarter} · Reserved</span><p>Prototype sample · ${r.selected_by}</p>${cancelButton(r)}</div>`,
                )
                .join("")
            : "<p>No samples reserved yet. Compare partners to begin.</p>"
        }</div></section><section class="card"><h2>Example collaborators</h2>${state.people
          .map(
            (n) =>
              `<p><span class="avatar">${n
                .split(" ")
                .map((x) => x[0])
                .join("")}</span>${n}</p>`,
          )
          .join("")}</section></div>`;
      }
      if (page === "comparison") {
        html = `<button class="back" data-go="project">← Project brief</button><div class="eyebrow">${esc(selected().name)}</div><div class="row"><h1>Find the right fit.</h1><button class="primary" id="new-supplier">＋ New supplier</button></div><p>Compare candidate partners and save a shortlist. Shortlisting does not reserve capacity.</p><span class="pill">${selected().shortlist.length} shortlisted</span>${steps()}<div class="compare">${state.suppliers.map((s) => `<section class="card"><div class="eyebrow">${esc(s.location)}</div><h2>${esc(s.name)}</h2><p>${esc(s.specialty)}</p><button data-shortlist="${s.id}" aria-pressed="${selected().shortlist.includes(s.id)}">${selected().shortlist.includes(s.id) ? "✓ Shortlisted" : "Add to shortlist"}</button> ${badge(s)} ${reservations(s).some((r) => r.project_id === projectId) ? '<span class="pill good">Sample reserved</span>' : ""}<div class="metric"><small>Illustrative sample lead time</small><strong>${s.lead} weeks</strong></div><div class="metric"><small>${quarter} development workload</small><strong>${load(s)} / ${limit(s) ?? "Not assessed"}</strong>${bar(s)}</div>${supplierFreight(s)}<div class="metric"><small>Sample route</small><strong>Prototype & material review</strong></div><button class="primary" data-supplier="${s.id}">Preview capacity →</button></section>`).join("")}</div>`;
      }
      if (page === "preview" || page === "selection") {
        let s = supplier(),
          exists = reservations(s).some((r) => r.project_id === projectId);
        html = `<button class="back" data-go="${page === "preview" ? "comparison" : "preview"}">← ${page === "preview" ? "Supplier comparison" : "Capacity preview"}</button><div class="eyebrow">${esc(selected().name)} / ${esc(s.name)}</div><h1>${page === "preview" ? "See the impact before you commit." : "Choose a sample. Hold a place."}</h1>${steps()}<section class="card wide"><div class="row"><h2>${esc(s.name)}</h2><select id="quarter" aria-label="Reservation quarter">${state.quarters.map((q) => `<option ${q === quarter ? "selected" : ""}>${q}</option>`).join("")}</select></div><p>${esc(s.specialty)} · ${esc(s.location)}</p><div class="split"><div class="metric"><small>Current workload</small><strong>${load(s)} projects</strong></div><div class="metric"><small>After sample selection</small><strong>${load(s) + (exists ? 0 : 1)} projects ${badge(s, exists ? 0 : 1)}</strong></div></div>${bar(s, exists ? 0 : 1)}<div class="callout">${limit(s) === null ? "Capacity is not assessed. Confirm availability with the supplier." : load(s) + (exists ? 0 : 1) > limit(s) ? "This reservation exceeds the assessed limit. Discuss timing with the supplier; this is a planning warning and does not block a reservation." : "There is room within the illustrative assessed development limit."}</div><p>Each project counts once per supplier per quarter. These fictional counts measure development projects, not production units or peak effort. Background workload is illustrative.</p>${page === "selection" ? `<div class="metric"><strong>Prototype sample · ${esc(selected().name)}</strong><small>One development slot · ${quarter} · Selected by ${esc(currentDemoActor())}</small></div><p><label><input type="checkbox" id="ack"> I have reviewed the capacity impact and want to reserve this sample.</label></p><button id="reserve" class="primary" ${exists ? "disabled" : ""}>${exists ? "Already reserved" : "Select sample & reserve capacity →"}</button>` : `<button class="primary" data-go="selection">Continue to sample selection →</button>`}<p id="error" role="alert"></p></section>`;
      }
      if (page === "confirmed") {
        html = `<section class="card wide"><div class="check">✓</div><div class="eyebrow">Sample selected</div><h1>A place in the plan.</h1><p>${esc(selected().name)} now has a sample reservation with ${esc(supplier().name)} for ${quarter}.</p><p>The reservation has been saved to the separate browser demo database.</p><button class="primary" data-go="workload">View supplier workload →</button> <button data-go="comparison">Compare another supplier</button></section>`;
      }
      if (page === "workload") {
        html = `<div class="row"><div><div class="eyebrow">Shared planning / All projects</div><h1>One view. Everyone’s workload.</h1><p>Sample reservations sit alongside illustrative background development work.</p></div><select id="quarter" aria-label="Workload quarter">${state.quarters.map((q) => `<option ${q === quarter ? "selected" : ""}>${q}</option>`).join("")}</select></div><div class="compare">${state.suppliers
          .map(
            (s) =>
              `<section class="card"><h2>${esc(s.name)}</h2><p>${esc(s.location)} · ${quarter}</p>${badge(s)}<div class="metric"><small>Scheduled / assessed limit</small><strong>${load(s)} / ${limit(s) ?? "Not assessed"}</strong>${bar(s)}</div><p>${assessment(s).background} illustrative background projects</p>${
                reservations(s).length
                  ? reservations(s)
                      .map(
                        (r) =>
                          `<div class="supplier"><span class="pill good">Sample reserved</span><p><button class="link" data-project="${r.project_id}">${esc(state.projects.find((p) => p.id === r.project_id).name)}</button></p><small>${r.selected_by} · ${r.quarter}</small>${cancelButton(r)}</div>`,
                      )
                      .join("")
                  : '<div class="empty">No sample reservations this quarter.</div>'
              }</section>`,
          )
          .join(
            "",
          )}</div><div class="callout">Not assessed is different from zero capacity. Over-limit reservations remain visible so the team can coordinate.</div>`;
      }
      html = designPage() ?? html;
      $("#app").innerHTML =
        '<p id="notice" role="status"></p>' +
        html +
        '<div class="footer">BRANCH · FICTIONAL BROWSER DEMO &nbsp; / &nbsp; Separate demo data · No production commitments</div>';
      bindPlanningActions();
      bindDesign();
      document
        .querySelectorAll("[data-go]")
        .forEach((b) => (b.onclick = () => go(b.dataset.go)));
      document.querySelectorAll("[data-project]").forEach(
        (b) =>
          (b.onclick = () => {
            projectId = +b.dataset.project;
            projectTab = "suppliers";
            go("project");
          }),
      );
      document.querySelectorAll("[data-supplier]").forEach(
        (b) =>
          (b.onclick = () => {
            supplierId = +b.dataset.supplier;
            go("preview");
          }),
      );
      if ($("#quarter"))
        $("#quarter").onchange = (e) => {
          quarter = e.target.value;
          saveLocation();
          render();
        };
      if ($("#reserve"))
        $("#reserve").onclick = async () => {
          if (!$("#ack").checked) {
            $("#error").textContent =
              "Review and acknowledge the capacity impact first.";
            return;
          }
          $("#reserve").disabled = true;
          try {
            await api("/api/reservations", {
              project_id: projectId,
              supplier_id: supplierId,
              quarter,
              expected_count: reservations(supplier()).length,
            });
            state = await api("/api/state");
            go("confirmed");
          } catch (e) {
            try {
              state = await api("/api/state");
              go("preview");
              $("#error").textContent =
                e.message + " Review the refreshed preview before continuing.";
            } catch (refreshError) {
              $("#error").textContent = refreshError.message;
              $("#reserve").disabled = false;
            }
          }
        };
    }
    function showNotice(message) {
      if ($("#notice")) $("#notice").textContent = message;
    }
    function cancelButton(r) {
      return `<button class="cancel-reservation" data-cancel="${esc(r.token)}">Release reservation</button>`;
    }
    function editBrief() {
      const project = selected(),
        dialog = $("#planning-dialog");
      dialog.innerHTML = `<form id="brief-form"><div class="row"><h2 id="dialog-title">Edit project brief</h2><span class="pill">BR-${String(project.id).padStart(3, "0")}</span></div><p>Save planning details for this project. Existing sample reservations keep their chosen quarters.</p><div class="form-field"><label for="brief-name">Project name</label><input id="brief-name" name="name" maxlength="120" required value="${esc(project.name)}"></div><div class="split"><div class="form-field"><label for="brief-owner">Project owner</label><select id="brief-owner" name="owner">${state.people.map((n) => `<option ${n === project.owner ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div><div class="form-field"><label for="brief-status">Stage</label><select id="brief-status" name="status">${state.statuses.map((n) => `<option ${n === project.status ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></div></div><div class="form-field"><label for="brief-category">Category</label><input id="brief-category" name="category" maxlength="80" required value="${esc(project.category)}"></div><div class="form-field"><label for="brief-description">Project description</label><textarea id="brief-description" name="description" maxlength="4000">${esc(project.description)}</textarea></div><div class="split"><div class="form-field"><label for="brief-development_start">Development start</label><input id="brief-development_start" name="development_start" type="date" min="2026-01-01" max="2030-12-31" required value="${esc(project.development_start)}"></div><div class="form-field"><label for="brief-development_end">Development completion</label><input id="brief-development_end" name="development_end" type="date" min="2026-01-01" max="2030-12-31" required value="${esc(project.development_end)}"></div></div><div class="form-field"><label for="brief-sample_due">Sample target</label><input id="brief-sample_due" name="sample_due" type="date" min="2026-01-01" max="2030-12-31" required value="${esc(project.sample_due)}"></div><p id="dialog-error" role="alert"></p><button type="button" id="reload-brief" hidden>Load latest brief (discard edits)</button><div class="actions"><button type="button" id="close-dialog">Cancel</button><button class="primary" id="save-brief">Save brief</button></div></form>`;
      if (!dialog.open) dialog.showModal();
      $("#close-dialog").onclick = () => dialog.close();
      $("#reload-brief").onclick = async () => {
        try {
          state = await api("/api/state");
          editBrief();
        } catch (e) {
          $("#dialog-error").textContent = e.message;
        }
      };
      $("#brief-form").onsubmit = async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(event.target));
        payload.expected_version = project.version;
        $("#save-brief").disabled = true;
        try {
          await api("/api/projects/" + project.id, payload, "PUT");
          state = await api("/api/state");
          dialog.close();
          render();
          showNotice("Project brief saved.");
        } catch (e) {
          $("#dialog-error").textContent = e.message;
          $("#reload-brief").hidden = e.status !== 409;
          $("#save-brief").disabled = false;
        }
      };
    }
    function releaseReservation(token) {
      const r = state.reservations.find((r) => r.token === token),
        dialog = $("#planning-dialog");
      dialog.innerHTML = `<h2 id="dialog-title">Release this reservation?</h2><p>${esc(state.projects.find((p) => p.id === r.project_id).name)} · ${esc(state.suppliers.find((s) => s.id === r.supplier_id).name)} · ${r.quarter}</p><div class="callout">This frees one reserved development slot. The project and other supplier reservations stay in the plan.</div><p id="dialog-error" role="alert"></p><div class="actions"><button id="keep-reservation">Keep reservation</button><button class="primary" id="confirm-release">Release reservation</button></div>`;
      dialog.showModal();
      $("#keep-reservation").onclick = () => dialog.close();
      $("#confirm-release").onclick = async () => {
        $("#confirm-release").disabled = true;
        try {
          await api("/api/reservations/cancel", {
            project_id: r.project_id,
            supplier_id: r.supplier_id,
            quarter: r.quarter,
            token: r.token,
          });
          state = await api("/api/state");
          dialog.close();
          render();
          showNotice("Reservation released. Supplier workload updated.");
        } catch (e) {
          $("#dialog-error").textContent = e.message;
          $("#confirm-release").disabled = false;
        }
      };
    }
    function bindPlanningActions() {
      if ($("#edit-project")) $("#edit-project").onclick = editBrief;
      document
        .querySelectorAll("[data-cancel]")
        .forEach(
          (b) => (b.onclick = () => releaseReservation(b.dataset.cancel)),
        );
      document.querySelectorAll("[data-shortlist]").forEach(
        (b) =>
          (b.onclick = async () => {
            const p = selected(),
              id = +b.dataset.shortlist;
            const ids = p.shortlist.includes(id)
              ? p.shortlist.filter((n) => n !== id)
              : [...p.shortlist, id];
            b.disabled = true;
            try {
              await api(
                "/api/projects/" + p.id + "/shortlist",
                { expected_version: p.version, supplier_ids: ids },
                "PUT",
              );
              state = await api("/api/state");
              render();
              showNotice("Supplier shortlist saved. No capacity was reserved.");
            } catch (e) {
              try {
                state = await api("/api/state");
                render();
              } catch {
                b.disabled = false;
              }
              showNotice(e.message);
            }
          }),
      );
    }
    document
      .querySelectorAll("nav button")
      .forEach((b) => (b.onclick = () => go(b.dataset.page)));
    function connectionControls(available) {
      document
        .querySelectorAll(
          "nav button, #agent-toggle, #export-demo-data, #restore-demo-data",
        )
        .forEach((button) => {
          button.disabled = !available;
        });
    }
    async function loadWorkspace() {
      $("#refresh").disabled = true;
      try {
        const next = await api("/api/state");
        if (
          !next ||
          ![
            "projects",
            "suppliers",
            "people",
            "reservations",
            "quarters",
            "capacity",
            "statuses",
          ].every((key) => Array.isArray(next[key]))
        ) {
          throw Error(
            "This address did not return the expected workspace. Open the running app link and try again.",
          );
        }
        const firstLoad = !state;
        state = next;
        if (firstLoad) readLocation();
        connectionControls(true);
        render();
        if (!firstLoad) showNotice("Workspace refreshed.");
      } catch (e) {
        if (state) {
          showNotice(
            "Refresh failed. Showing the last loaded workspace. " + e.message,
          );
        } else {
          connectionControls(false);
          $("#app").innerHTML =
            `<section class="card wide"><div class="eyebrow">Workspace connection</div><h1>Let’s reconnect.</h1><p role="alert">${esc(e.message)}</p><p>The workspace hasn’t loaded. Your saved projects and reservations have not been changed.</p><button class="primary" id="retry-workspace">Try again</button> <a href="preview.html" style="display:inline-block;margin:12px">Open interactive fictional preview →</a></section>`;
          $("#retry-workspace").onclick = loadWorkspace;
        }
      } finally {
        $("#refresh").disabled = false;
      }
    }
    $("#refresh").onclick = loadWorkspace;
    window.addEventListener("popstate", () => {
      if (state) {
        readLocation();
        render();

const icons = {
  overview: '<path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/>',
  projects: '<path d="M3 6h7l2 3h9v11H3zM3 6V4h7l2 2h9v3"/>',

  capacity: '<path d="M4 21V11h4v10m4 0V4h4v17m4 0v-7h3v7M2 21h22"/>',
};
function icon(name) {
  return `<svg class="nav-icon" viewBox="0 0 26 26" aria-hidden="true">${icons[name] || icons.projects}</svg>`;
}
function art(p, hero = false) {
  if (validProjectImage(p.image_data))
    return `<div class="product-art uploaded-art" role="img" aria-label="${esc(p.name)} project image"><img src="${esc(p.image_data)}" alt="" loading="${hero ? "eager" : "lazy"}"></div>`;
  const concepts = {
    "Compact standing-desk variant": "compact-standing-desk",
    "Form task chair": "form-task-chair",
    "Gather meeting table": "gather-meeting-table",
    "Nest lounge chair": "nest-lounge-chair",
    "Fold desk system": "fold-desk-system",
    "Cove privacy screen": "cove-privacy-screen",
    "Line storage": "line-storage",
    "Arc counter stool": "arc-counter-stool",
    "Trail folding worktable": "trail-folding-worktable",
    "Haven acoustic screen": "haven-acoustic-screen",
  };
  const key =
    concepts[p.name] ||
    (/chair|seating/i.test(p.category)
      ? "form-task-chair"
      : /desk|table|office/i.test(p.category)
        ? "compact-standing-desk"
        : "haven-acoustic-screen");
  return `<div class="product-art uploaded-art concept-art" role="img" aria-label="${esc(p.name)} illustrative concept" title="Illustrative concept image"><img src="${branchImages[key]}" alt="" loading="${hero ? "eager" : "lazy"}"></div>`;
}
function stagePill(stage) {
  const type =
    stage === "Quoting" ? "warn" : stage === "Discussions" ? "neutral" : "good";
  return `<span class="pill ${type}"><span class="dot"></span>${esc(stage)}</span>`;
}
function projectStage(p) {
  return stagePill(p.status === "Development" ? "In development" : p.status);
}
function todayLocal() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).format(new Date());
}
function dateLabel(date) {
  return new Intl.DateTimeFormat("en-US", {
    month: "short",
    day: "numeric",
    year: "numeric",
    timeZone: "UTC",
  }).format(new Date(date + "T12:00:00Z"));
}
function projectActions(p, includeCompleted = false) {
  return [
    ...Object.entries(p.supplier_details || {})
      .filter(([, d]) => d.next_action)
      .map(([sid, d]) => ({ ...d, supplier_id: +sid, project_id: p.id })),
    ...(p.actions || []).map((a) => ({
      ...a,
      next_action: a.title,
      action_id: a.id,
      project_id: p.id,
    })),
  ]
    .filter((a) => includeCompleted || !a.completed)
    .sort((a, b) => a.due_date.localeCompare(b.due_date));
}
function actionSupplierName(a) {
  return (
    state.suppliers.find((s) => s.id === a.supplier_id)?.name ||
    "Project action"
  );
}
function actionTrigger(a) {
  return a.action_id
    ? `data-edit-action="${a.project_id}:${a.action_id}"`
    : `data-track="${a.project_id}:${a.supplier_id}"`;
}

function allActions() {
  return state.projects
    .flatMap(projectActions)
    .sort(
      (a, b) =>
        a.due_date.localeCompare(b.due_date) || a.project_id - b.project_id,
    );
}
function nextActions(p, limit = 3) {
  const actions = p ? projectActions(p) : allActions();
  return (
    actions
      .slice(0, limit)
      .map(
        (a) =>
          `<div class="next-action"><button class="action-marker ${a.due_date < todayLocal() ? "overdue" : ""}" ${actionTrigger(a)} aria-label="Update ${esc(a.next_action)}">${a.due_date < todayLocal() ? "!" : ""}</button><div><strong>${esc(a.next_action)}</strong><small>${esc(actionSupplierName(a))}${!p ? " · " + esc(state.projects.find((p) => p.id === a.project_id).name) : ""}</small></div><time datetime="${a.due_date}">${dateLabel(a.due_date)}</time></div>`,
      )
      .join("") || '<p class="empty">All supplier actions are up to date.</p>'
  );
}
function agentCard(p) {
  const overdue = (p ? projectActions(p) : allActions()).filter(
    (a) => a.due_date < todayLocal(),
  );
  return `<section class="card agent-card section"><div class="agent-layout"><span class="agent-symbol">✧</span><div><h2>Branch AI</h2><span class="agent-mode">Project tracking assistant</span></div></div><p>${overdue.length ? `${overdue.length} actions need a follow-up. Review what’s overdue and plan the next step.` : "Keep the next milestone in sight. Review project status and upcoming follow-ups."}</p><button class="primary" data-agent>Review with assistant →</button></section>`;
}
function projectRows(projects) {
  return projects
    .map(
      (p) =>
        `<div class="project-row">${art(p)}<div><button class="link project-name" data-project="${p.id}">${esc(p.name)}</button><small>${esc(p.category)} · Target launch ${esc(p.target_launch || "2027")}</small></div>${projectStage(p)}<button class="arrow" data-project="${p.id}" aria-label="Open ${esc(p.name)}">›</button></div>`,
    )
    .join("");
}

function openTracking(project, sid, suggestion, completedOverride) {

    try {
      state = await api("/api/state");
      openTracking(
        state.projects.find((p) => p.id === project.id),
        sid,
      );
    } catch (e) {
      $("#dialog-error").textContent = e.message;
    }

    fields.completed = e.target.elements.completed.checked;

      await api(`/api/projects/${project.id}/suppliers/${sid}`, fields, "PUT");

      $("#reload-tracking").hidden = error.status !== 409;
      $("#save-tracking").disabled = false;
    }
  };
}

function currentAgentScope() {

async function runAgent() {
  const question =
    $("#agent-question")?.value ||
    "Summarize project status, flag overdue actions, and suggest follow-ups.";
  const scope = currentAgentScope();
  const requestId = ++agentRequestId;
  agentScope = scope;
  agentBusy = true;
  drawAgent();
  try {
    const result = await api("/api/agent/analyze", {
      project_id: typeof scope === "string" ? null : scope,
      ...(typeof scope === "string"
        ? { owner: scope.slice("developer:".length) }
        : {}),
      question,
    });
    if (requestId !== agentRequestId) return;
    agentResult = result;
  } catch (e) {
    if (requestId !== agentRequestId) return;
    agentBusy = false;
    drawAgent();
    $("#agent-content").textContent = e.message;
    return;
  }
  agentBusy = false;
  drawAgent();
}
function openAgent() {
  const scope = currentAgentScope();
  if (scope !== agentScope) {
    agentResult = null;
    agentBusy = false;
    agentRequestId++;
    agentScope = scope;
  }
  ensureAgent();
  $("#tracking-agent").hidden = false;
  drawAgent();
  $("#agent-question").focus();
}

let actionFilters = {

function readActionFilters(params) {

      : "",
    supplier: state.suppliers.some(
      (s) => String(s.id) === params.get("supplierFilter"),
    )
      ? params.get("supplierFilter")
      : "",
    project: state.projects.some(
      (p) => String(p.id) === params.get("projectFilter"),
    )
      ? params.get("projectFilter")
      : "",
    status: ["open", "completed", "all"].includes(params.get("status"))
      ? params.get("status")
      : "open",
    due: ["any", "overdue", "today", "week"].includes(params.get("due"))
      ? params.get("due")
      : "any",
    query: (params.get("query") || "").slice(0, 200),
  };
}
function actionFilterQuery() {
  const params = new URLSearchParams(actionFilters);
  params.set("supplierFilter", actionFilters.supplier);
  params.set("projectFilter", actionFilters.project);
  params.delete("supplier");
  params.delete("project");
  return params.toString();
}
function trackedActions() {
  return state.projects
    .flatMap((p) =>
      projectActions(p, true).map((a) => ({
        ...a,
        project: p.name,
        owner: p.owner,
      })),
    )
    .sort(
      (a, b) =>
        Number(a.completed) - Number(b.completed) ||
        a.due_date.localeCompare(b.due_date) ||
        a.project_id - b.project_id,
    );
}

function actionStatus(a) {

      ? "Overdue"
      : a.due_date === todayLocal()
        ? "Due today"
        : "Upcoming";
}

function validProjectImage(value) {
  return (
    typeof value === "string" &&
    value.length <= 450000 &&
    /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(value)
  );
}
async function prepareProjectImage(file) {
  if (!["image/jpeg", "image/png", "image/webp"].includes(file.type))
    throw Error("Choose a JPG, PNG, or WebP image.");
  if (file.size > 10 * 1024 * 1024)
    throw Error("Choose an image smaller than 10 MB.");
  const objectURL = URL.createObjectURL(file),
    img = new Image();
  try {
    img.src = objectURL;
    await img.decode();
    if (!img.naturalWidth || !img.naturalHeight) throw Error("Invalid image");
    const scale = Math.min(
      1,
      1200 / Math.max(img.naturalWidth, img.naturalHeight),
    );
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
    const context = canvas.getContext("2d");
    context.fillStyle = "#f7f5ef";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(img, 0, 0, canvas.width, canvas.height);
    for (const quality of [0.82, 0.65, 0.45]) {
      const encoded = canvas.toDataURL("image/jpeg", quality);
      if (validProjectImage(encoded)) return encoded;
    }
    throw Error("This image is too detailed. Choose a smaller image.");
  } catch (error) {
    throw Error(
      error.message.includes("too detailed")
        ? error.message
        : "This image could not be opened. Choose another JPG, PNG, or WebP.",
    );
  } finally {
    URL.revokeObjectURL(objectURL);
  }
}

function makeDemoBackup(snapshot) {
  const { auth, ...data } = structuredClone(snapshot);
  data.reservations = data.reservations.map(
    ({ token, ...reservation }) => reservation,
  );
  data.projects = data.projects.map((p) => ({
    ...p,
    ...(p.actions
      ? { actions: p.actions.map(({ creation_payload, ...action }) => action) }
      : {}),
  }));
  return {
    format: "branch-capacity-demo",
    version: 1,
    exported_at: new Date().toISOString(),
    storage:
      auth?.mode === "team"
        ? "shared-server"
        : typeof previewData !== "undefined"
          ? "browser-local"
          : "demo-server",
    data,
  };
}
function downloadDemoBackup(backup, filename) {
  const blob = new Blob([JSON.stringify(backup, null, 2)], {
      type: "application/json",
    }),
    url = URL.createObjectURL(blob),
    link = document.createElement("a");
  link.href = url;
  link.download = filename;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportDemoData() {
  const button = $("#export-demo-data");
  button.disabled = true;
  try {
    downloadDemoBackup(
      makeDemoBackup(await api("/api/state")),
      "branch-demo-data-" + todayLocal() + ".json",
    );
    showNotice(
      "Data backup downloaded. Your projects, suppliers, actions and reservations have not changed.",
    );
  } catch (error) {
    showNotice("Export failed: " + error.message);
  } finally {
    button.disabled = false;
  }
}

function readProjectPeriod(params) {
  const year = params.get("projectYear") || "",
    quarter = params.get("projectQuarter") || "";
  projectPeriod = {
    year: /^20(2[6-9]|3[0-5])$/.test(year) ? year : "",
    quarter: ["1", "2", "3", "4"].includes(quarter) && year ? quarter : "",
  };
}
function projectPeriodQuery() {
  return new URLSearchParams({
    projectYear: projectPeriod.year,
    projectQuarter: projectPeriod.quarter,
  }).toString();
}
function projectsInPeriod() {
  if (page !== "projects" || !projectPeriod.year) return state.projects;
  const year = Number(projectPeriod.year),
    q = Number(projectPeriod.quarter),
    start =
      year + "-" + String(q ? (q - 1) * 3 + 1 : 1).padStart(2, "0") + "-01",
    end = new Date(Date.UTC(year, q ? q * 3 : 12, 0))
      .toISOString()
      .slice(0, 10);
  return state.projects.filter(
    (p) => p.development_start <= end && p.development_end >= start,
  );
}

        current.projects.find((old) => old.id === p.id)?.version || 0,
      ) + 1;
  for (const s of result.suppliers)
    s.version =
      Math.max(
        s.version,
        current.suppliers.find((old) => old.id === s.id)?.version || 1,
      ) + 1;
  result.reservations = result.reservations.map((r) => ({
    ...r,
    token: crypto.randomUUID(),
  }));
  result.restore_generation = crypto.randomUUID();
  result.last_restore = {
    restored_at: new Date().toISOString(),
    mode: "reviewed-browser-snapshot",
  };
  // localStorage writes are atomic. Update live memory only after a successful save.
  localStorage.setItem(PREVIEW_STORAGE_KEY, JSON.stringify(result));
  previewData = result;
  previewCapacity();
}
async function verifyRestoreImages(data) {
  for (const project of data.projects.filter((p) => p.image_data)) {
    const img = new Image();
    img.src = project.image_data;
    try {
      await img.decode();
    } catch {
      restoreProblem(
        "A project image cannot be decoded. No records were changed.",
      );
    }
    if (
      !img.naturalWidth ||
      !img.naturalHeight ||
      img.naturalWidth > 1200 ||
      img.naturalHeight > 1200
    )
      restoreProblem(
        "Project image dimensions are unsupported. Use an exported, resized project image.",
      );
  }
}
